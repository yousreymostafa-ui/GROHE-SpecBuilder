name: Deploy GROHE SpecBuilder releases

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout releases
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # Base GROHE SpecBuilder runtime.
          cp index.html dist/
          cp favicon.svg dist/
          cp styles.css dist/
          cp card-pdf-actions.css dist/
          cp missing-image-google.css dist/
          cp data-sheet-viewer.css dist/
          cp core.js dist/
          cp storage.js dist/
          cp seed-products.js dist/
          cp app.js dist/

          # Integrated release changes: export choice + native PDF Kit handoff.
          patch -d dist -p0 < .deploy/v18_5/index.html.patch
          patch -d dist -p0 < .deploy/v18_5/app.js.patch
          patch -d dist -p0 < .deploy/v18_5/pdfkit-exact-handoff.patch
          cat .deploy/v18_5/styles.add.css >> dist/styles.css

          # v18.6 settings workspace + manual product status controls.
          cp .deploy/v18_6/settings-ui.js dist/settings-ui.js
          cp .deploy/v18_6/settings-ui.css dist/settings-ui.css
          python3 -c "from pathlib import Path; p=Path('dist/index.html'); s=p.read_text(); s=s.replace('</head>','  <link rel=\"stylesheet\" href=\"settings-ui.css\" />\\n</head>',1).replace('</body>','  <script src=\"settings-ui.js\"></script>\\n</body>',1); p.write_text(s)"

          # v18.7 right-panel controls, scrollbar cleanup and export guard.
          cp .deploy/v18_7/ui-fixes.js dist/ui-fixes.js
          cp .deploy/v18_7/ui-fixes.css dist/ui-fixes.css
          python3 -c "from pathlib import Path; p=Path('dist/index.html'); s=p.read_text(); s=s.replace('</head>','  <link rel=\"stylesheet\" href=\"ui-fixes.css\" />\\n</head>',1).replace('</body>','  <script src=\"ui-fixes.js\"></script>\\n</body>',1); p.write_text(s)"

          # v18.8 pruned reference sync from GROHE_Common_SKUs.xlsx.
          cp .deploy/v18_8/pruned-sync.js dist/pruned-sync.js
          python3 -c "from pathlib import Path; p=Path('dist/index.html'); s=p.read_text(); s=s.replace('<script src=\"app.js\"></script>','<script src=\"pruned-sync.js\"></script>\\n<script src=\"app.js\"></script>',1); p.write_text(s)"

          # v18.9 unified design system + responsive workspace.
          cp .deploy/v18_9/design-system.css dist/design-system.css
          cp .deploy/v18_9/responsive-ui.js dist/responsive-ui.js
          python3 -c "from pathlib import Path; p=Path('dist/index.html'); s=p.read_text(); s=s.replace('</head>','  <link rel=\"stylesheet\" href=\"design-system.css\" />\\n</head>',1).replace('</body>','  <script src=\"responsive-ui.js\"></script>\\n</body>',1); p.write_text(s)"

          # Browser-capable Data Sheet locator based on PDF Kit Pro 12.11.1 matching.
          cp .deploy/v18_5/data-sheet-viewer.js dist/data-sheet-viewer.js

          # Optional account route. Guests remain fully usable; signed-in users get cloud projects/profile.
          cp -R multi-user dist/multi-user

          # PDF Kit Pro v12.11.1. If the original desktop ZIP (or extracted folder)
          # is present in the repository, publish every original file unchanged.
          EXACT_PDFKIT_HASH="4a21e06271c1683c7716c344932f8be1e573e4e2c8579c8780ade88a95d192ec"
          if [ -f "PDF_Kit_Pro_Desktop_v12.11.1.zip" ]; then
            rm -rf dist/pdf-kit-pro dist/.pdfkit-extract
            mkdir -p dist/pdf-kit-pro dist/.pdfkit-extract
            unzip -q "PDF_Kit_Pro_Desktop_v12.11.1.zip" -d dist/.pdfkit-extract
            cp -R dist/.pdfkit-extract/PDF_Kit_Pro_Desktop/. dist/pdf-kit-pro/
            rm -rf dist/.pdfkit-extract
          elif [ -f "PDF_Kit_Pro_Desktop/pdf_kit_pro.html" ]; then
            rm -rf dist/pdf-kit-pro
            mkdir -p dist/pdf-kit-pro
            cp -R PDF_Kit_Pro_Desktop/. dist/pdf-kit-pro/
          else
            cp -R pdf-kit-pro dist/pdf-kit-pro
          fi

          if [ -f dist/pdf-kit-pro/pdf_kit_pro.html ]; then
            echo "$EXACT_PDFKIT_HASH  dist/pdf-kit-pro/pdf_kit_pro.html" | sha256sum -c -
            printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF KIT PRO</title><script>location.replace("pdf_kit_pro.html"+location.search+location.hash)</script></head><body></body></html>' > dist/pdf-kit-pro/index.html
          fi

          touch dist/.nojekyll

          # Deployment contract checks.
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/seed-products.js
          test -s dist/data-sheet-viewer.js
          test -s dist/settings-ui.js
          test -s dist/settings-ui.css
          test -s dist/ui-fixes.js
          test -s dist/ui-fixes.css
          test -s dist/pruned-sync.js
          test -s dist/design-system.css
          test -s dist/responsive-ui.js
          test -s dist/multi-user/index.html
          test -s dist/multi-user/loader.js
          test -s dist/multi-user/auth.js
          test -s dist/multi-user/storage.js
          test -s dist/multi-user/supabase-config.js
          test -s dist/pdf-kit-pro/index.html
          grep -q 'btnExportPdfOnly' dist/index.html
          grep -q 'settings-ui.js' dist/index.html
          grep -q 'ui-fixes.js' dist/index.html
          grep -q 'pruned-sync.js' dist/index.html
          grep -q 'GROHE_Common_SKUs.xlsx' dist/pruned-sync.js
          grep -q 'design-system.css' dist/index.html
          grep -q 'responsive-ui.js' dist/index.html
          grep -q 'mobile-workspace-nav' dist/responsive-ui.js
          grep -q 'backend-modal' dist/design-system.css
          grep -q 'settings-workspace-dialog' dist/design-system.css
          grep -q '@media(max-width:900px)' dist/design-system.css
          grep -q '30632000' dist/pruned-sync.js
          grep -q '47877000' dist/pruned-sync.js
          grep -q 'settingsWorkspaceDialog' dist/settings-ui.js
          grep -q 'btnBackExportChoice' dist/settings-ui.js
          grep -q 'selectionTextSize' dist/ui-fixes.js
          grep -q 'scrollbar-width:none' dist/ui-fixes.css
          grep -q 'openPdfKitPro' dist/app.js
          grep -q 'btnExportPdfOnly' dist/app.js
          grep -q "localStorage.setItem('pk7'" dist/app.js
          grep -q 'showDirectoryPicker' dist/data-sheet-viewer.js
          grep -q '20260827-2' dist/multi-user/loader.js
          grep -q 'favicon.svg?v=20260827-2' dist/multi-user/index.html

          if [ -f dist/pdf-kit-pro/pdf_kit_pro.html ]; then
            test -s dist/pdf-kit-pro/package.json
            test -s dist/pdf-kit-pro/main.js
            test -s dist/pdf-kit-pro/preload.js
            test -s dist/pdf-kit-pro/README.txt
            echo "$EXACT_PDFKIT_HASH  dist/pdf-kit-pro/pdf_kit_pro.html" | sha256sum -c -
          else
            test -s dist/pdf-kit-pro/app.js
            grep -q 'grohe-pdfkit-transfer' dist/pdf-kit-pro/app.js
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
