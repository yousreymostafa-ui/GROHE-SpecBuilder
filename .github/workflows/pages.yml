name: Deploy GROHE SpecBuilder v18.4.6

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v18.4.6 static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xJf .deploy/v18_4_6/runtime.tar.xz -C dist
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/seed-products.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
